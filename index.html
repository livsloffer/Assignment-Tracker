<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8f6;
    --card: #ffffff;
    --ink: #4a3b40;
    --muted: #9a8a8f;
    --rose: #f4a7b9;
    --rose-deep: #e07a96;
    --blush: #fde4ea;
    --lilac: #e9defa;
    --lilac-ink: #6d56a3;
    --sage: #dcefe3;
    --sage-ink: #4f8a69;
    --butter: #fff1cf;
    --butter-ink: #a07a1c;
    --shadow: 0 8px 24px rgba(224, 122, 150, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 0%, #fde4ea 0, transparent 40%),
      radial-gradient(circle at 90% 10%, #e9defa 0, transparent 35%),
      var(--bg);
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 18px 80px; }

  header { text-align: center; margin-bottom: 26px; }
  .eyebrow { letter-spacing: .25em; text-transform: uppercase; font-size: 12px; color: var(--rose-deep); font-weight: 600; }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(34px, 6vw, 52px); margin: 8px 0 6px; font-weight: 600; }
  h1 em { color: var(--rose-deep); font-weight: 500; }
  .sub { color: var(--muted); margin: 0; }

  h2 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; margin: 34px 0 14px; }
  h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--rose-deep); margin: 0 0 12px; font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0 14px; }
  .stat { background: var(--card); border-radius: 20px; padding: 16px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 28px; font-family: 'Playfair Display', serif; color: var(--rose-deep); }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

  .card { background: var(--card); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); }
  .progress-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 8px; }
  .bar { height: 12px; background: var(--blush); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--rose-deep)); border-radius: 99px; transition: width .7s ease; }

  .grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grade { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); text-align: center; transition: transform .2s; cursor: pointer; border: 2px solid transparent; }
  .grade:hover { transform: translateY(-3px); }
  .grade.on { border-color: var(--rose); }
  .grade .cname { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .grade .letter { font-family: 'Playfair Display', serif; font-size: 44px; line-height: 1.1; margin: 6px 0 0; }
  .grade .pct { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .grade .mini { height: 6px; background: var(--blush); border-radius: 99px; overflow: hidden; }
  .grade .mini i { display: block; height: 100%; background: var(--rose); border-radius: 99px; transition: width .7s ease; }
  .L-A { color: var(--sage-ink); } .L-B { color: var(--butter-ink); } .L-C, .L-D, .L-F { color: var(--rose-deep); }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .mini-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--blush); font-size: 14px; }
  .mini-row:first-of-type { border-top: none; }
  .mini-row small { display: block; color: var(--muted); font-size: 12px; }
  .pill { background: var(--lilac); color: var(--lilac-ink); padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .when { font-size: 12px; font-weight: 600; color: var(--rose-deep); white-space: nowrap; }
  .none { color: var(--muted); font-size: 14px; padding: 6px 0; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .search { flex: 1 1 200px; padding: 12px 16px; border-radius: 99px; border: 2px solid transparent; background: var(--card); font: inherit; color: var(--ink); box-shadow: var(--shadow); outline: none; }
  .search:focus { border-color: var(--rose); }
  select { padding: 12px 14px; border-radius: 99px; border: none; background: var(--card); font: inherit; color: var(--ink); box-shadow: var(--shadow); cursor: pointer; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
  .chip { border: none; padding: 8px 16px; border-radius: 99px; background: var(--card); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, background .15s; }
  .chip:hover { transform: translateY(-2px); }
  .chip.active { background: var(--rose-deep); color: #fff; }

  .list { display: grid; gap: 12px; }
  .item { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow); transition: transform .2s, opacity .3s; animation: pop .35s ease both; }
  .item:hover { transform: translateY(-3px); }
  .item.done { opacity: .62; }
  .item.done .title { text-decoration: line-through; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .check { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--rose); background: #fff; cursor: pointer; flex: none; display: grid; place-content: center; transition: .2s; margin: 0; }
  .check:checked { background: var(--rose-deep); border-color: var(--rose-deep); }
  .check:checked::after { content: "✓"; color: #fff; font-size: 15px; }

  .info { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 16px; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
  .b-todo { background: var(--blush); color: var(--rose-deep); }
  .b-exam { background: var(--butter); color: var(--butter-ink); }
  .b-done { background: var(--sage); color: var(--sage-ink); }
  .due-soon { color: var(--rose-deep); font-weight: 600; }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 26px; }
  .spark { position: fixed; pointer-events: none; font-size: 20px; animation: float 1s ease-out forwards; z-index: 9; }
  @keyframes float { to { transform: translate(var(--x), var(--y)) scale(.4); opacity: 0; } }

  @media (max-width: 640px) {
    .grades, .two { grid-template-columns: 1fr; }
    .grades { gap: 10px; }
  }
  @media (max-width: 520px) {
    .item { flex-wrap: wrap; }
    .badge { margin-left: 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">✿ Study Planner ✿</div>
    <h1>My <em>Assignment</em> Tracker</h1>
    <p class="sub" id="today"></p>
  </header>

  <section class="stats">
    <div class="stat"><b id="sDone">0</b><span>Complete</span></div>
    <div class="stat"><b id="sLeft">0</b><span>Left</span></div>
    <div class="stat"><b id="sSoon">0</b><span>Due in 7 days</span></div>
  </section>

  <section class="card">
    <div class="progress-top"><span id="cheer">Semester progress</span><b id="pct">0%</b></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </section>

  <h2>Report Card</h2>
  <section class="grades" id="grades"></section>
  <p class="hint">Tap a course to filter the list below.</p>

  <section class="two">
    <div class="card">
      <h3>Upcoming Tests</h3>
      <div id="tests"></div>
    </div>
    <div class="card">
      <h3>To Complete This Week</h3>
      <div id="week"></div>
    </div>
  </section>

  <h2>All Assignments</h2>
  <section class="controls">
    <input class="search" id="search" type="search" placeholder="Search assignments…">
    <select id="sort">
      <option value="due">Sort: Due date</option>
      <option value="course">Sort: Course</option>
      <option value="sched">Sort: Planned date</option>
    </select>
    <div class="chips" id="statusChips"></div>
    <div class="chips" id="courseChips"></div>
  </section>

  <section class="list" id="list"></section>
  <p class="note" id="note"></p>
</div>

let rows = DATA.slice();
let statusFilter = "To do";
let courseFilter = "All";

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
let overrides = {};
try { overrides = JSON.parse(safeGet("overrides") || "{}"); } catch(e){ overrides = {}; }

/* ---------- dates ---------- */
function parseDate(s){
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  if (isNaN(d)) return null;
  d.setHours(0,0,0,0);
  return d;
}
function toISO(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function today(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function daysUntil(s){
  const d = parseDate(s); if (!d) return null;
  return Math.round((d - today()) / 86400000);
}
function fmtDate(s){
  const d = parseDate(s);
  return d ? d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "No date";
}
function whenText(n){
  if (n === null) return "";
  if (n < 0) return "overdue";
  if (n === 0) return "today!";
  if (n === 1) return "tomorrow";
  return "in " + n + " days";
}

/* ---------- data helpers ---------- */
const isExam = r => /\b(tests?|exams?)\b/i.test(r.name);
const keyOf = r => r.name + "|" + r.course + "|" + r.due;
function isDone(r){ const k = keyOf(r); return (k in overrides) ? overrides[k] : r.done; }
function letter(p){ return p >= .9 ? "A" : p >= .8 ? "B" : p >= .7 ? "C" : p >= .6 ? "D" : "F"; }
function scoreText(r){
  if (r.earned === null) return "";
  if (r.possible > 0) return r.earned + "/" + r.possible;
  return r.earned > 0 ? "+" + r.earned + " bonus" : "";
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* ---------- Google Sheets CSV ---------- */
function parseCSV(text){
  const out = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ""; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); out.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ""));
}
function fromCSV(text){
  const data = parseCSV(text);
  const h = data.findIndex(r => r.some(c => /assignment/i.test(c)) && r.some(c => /due/i.test(c)));
  if (h < 0) throw new Error('wrong tab: no "Assignment" and "Due Date" headers found; the first row starts with "' + (data[0] || []).filter(Boolean).slice(0, 3).join(" | ") + '"');
  const head = data[h].map(x => x.trim().toLowerCase());
  const idx = (...keys) => head.findIndex(h => keys.some(k => h.includes(k)));
  const iName = idx("assignment"), iCourse = idx("course"), iDue = idx("due date"),
        iSched = idx("scheduled"), iSub = idx("submitted"),
        iEarn = idx("points earned"), iPoss = idx("points possible");
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const iso = v => { const d = parseDate((v || "").trim()); return d ? toISO(d) : ""; };
  return data.slice(h + 1).map(r => ({
    name: (r[iName] || "").trim(),
    course: iCourse >= 0 ? (r[iCourse] || "").trim() : "",
    due: iso(r[iDue]),
    sched: iSched >= 0 ? iso(r[iSched]) : "",
    done: iSub >= 0 ? /^true$/i.test((r[iSub] || "").trim()) : false,
    earned: iEarn >= 0 ? num(r[iEarn]) : null,
    possible: iPoss >= 0 ? num(r[iPoss]) : null
  })).filter(r => r.name);
}

/* ---------- rendering ---------- */
function renderStats(){
  const done = rows.filter(isDone).length;
  const left = rows.length - done;
  const soon = rows.filter(r => { const n = daysUntil(r.due); return !isDone(r) && n !== null && n >= 0 && n <= 7; }).length;
  document.getElementById("sDone").textContent = done;
  document.getElementById("sLeft").textContent = left;
  document.getElementById("sSoon").textContent = soon;
  const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("fill").style.width = pct + "%";
  document.getElementById("cheer").textContent = "You're " + pct + "% done with the semester!";
}

function renderGrades(){
  const box = document.getElementById("grades");
  box.innerHTML = "";
  const courses = COURSE_ORDER.concat([...new Set(rows.map(r => r.course))].filter(c => c && !COURSE_ORDER.includes(c)));
  courses.forEach(c => {
    const mine = rows.filter(r => r.course === c);
    if (!mine.length) return;
    const earned = mine.reduce((s, r) => s + (r.earned || 0), 0);
    const poss = mine.reduce((s, r) => s + (r.possible || 0), 0);
    const p = poss > 0 ? earned / poss : null;
    const g = el("div", "grade" + (courseFilter === c ? " on" : ""));
    g.appendChild(el("div", "cname", c));
    g.appendChild(el("div", "letter" + (p !== null ? " L-" + letter(p) : ""), p !== null ? letter(p) : "–"));
    g.appendChild(el("div", "pct", p !== null ? (p * 100).toFixed(1) + "%" : "No grades yet"));
    const mini = el("div", "mini"); const i = el("i");
    i.style.width = p !== null ? Math.min(100, p * 100) + "%" : "0%";
    mini.appendChild(i); g.appendChild(mini);
    g.onclick = () => { courseFilter = (courseFilter === c) ? "All" : c; syncChips(); renderGrades(); renderList(); };
    box.appendChild(g);
  });
}

function renderTests(){
  const box = document.getElementById("tests");
  box.innerHTML = "";
  const list = rows.filter(r => isExam(r) && !isDone(r) && daysUntil(r.due) !== null && daysUntil(r.due) >= 0)
    .sort((a, b) => parseDate(a.due) - parseDate(b.due)).slice(0, 4);
  if (!list.length) { box.appendChild(el("div", "none", "No upcoming tests")); return; }
  list.forEach(r => {
    const row = el("div", "mini-row");
    const left = el("div");
    left.appendChild(el("div", "", r.name));
    left.appendChild(el("small", "", r.course + " · " + fmtDate(r.due)));
    row.appendChild(left);
    row.appendChild(el("span", "when", whenText(daysUntil(r.due))));
    box.appendChild(row);
  });
}

function renderWeek(){
  const box = document.getElementById("week");
  box.innerHTML = "";
  const t = today();
  const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const list = rows.filter(r => {
    const d = parseDate(r.sched);
    return d && d >= mon && d <= sun && !isDone(r);
  }).sort((a, b) => parseDate(a.sched) - parseDate(b.sched));
  if (!list.length) { box.appendChild(el("div", "none", "Nothing scheduled this week ✨")); return; }
  list.forEach(r => {
    const row = el("div", "mini-row");
    const left = el("div");
    left.appendChild(el("div", "", r.name));
    left.appendChild(el("small", "", r.course));
    row.appendChild(left);
    row.appendChild(el("span", "when", fmtDate(r.sched)));
    box.appendChild(row);
  });
}

function renderList(){
  const q = document.getElementById("search").value.toLowerCase();
  const sort = document.getElementById("sort").value;
  let list = rows.filter(r => {
    const d = isDone(r);
    return (statusFilter === "All" || (statusFilter === "Done") === d) &&
           (courseFilter === "All" || r.course === courseFilter) &&
           (r.name + " " + r.course).toLowerCase().includes(q);
  });
  list.sort((a, b) => {
    if (sort === "course") return a.course.localeCompare(b.course) || (parseDate(a.due) - parseDate(b.due));
    const f = sort === "sched" ? "sched" : "due";
    return (parseDate(a[f]) || Infinity) - (parseDate(b[f]) || Infinity);
  });

  const box = document.getElementById("list");
  box.innerHTML = "";
  if (!list.length) { box.appendChild(el("div", "empty", "Nothing here, enjoy the calm ✨")); return; }

  list.forEach((r, i) => {
    const done = isDone(r);
    const n = daysUntil(r.due);
    const soon = !done && n !== null && n <= 3;
    const item = el("div", "item" + (done ? " done" : ""));
    item.style.animationDelay = Math.min(i, 12) * 40 + "ms";

    const cb = el("input", "check"); cb.type = "checkbox"; cb.checked = done;
    cb.setAttribute("aria-label", "Mark " + r.name + " done");
    cb.addEventListener("change", e => {
      overrides[keyOf(r)] = e.target.checked;
      if (e.target.checked) sparkle(e.target);
      safeSet("overrides", JSON.stringify(overrides));
      renderAll();
    });

    const info = el("div", "info");
    info.appendChild(el("div", "title", r.name));
    const meta = el("div", "meta");
    meta.appendChild(el("span", "pill", r.course));
    let dueTxt = "Due " + fmtDate(r.due);
    if (!done && n !== null && n <= 7) dueTxt += " · " + whenText(n);
    meta.appendChild(el("span", soon ? "due-soon" : "", dueTxt));
    if (done && scoreText(r)) meta.appendChild(el("span", "", "Score " + scoreText(r)));
    info.appendChild(meta);

    item.appendChild(cb);
    item.appendChild(info);
    item.appendChild(el("span", "badge " + (done ? "b-done" : isExam(r) ? "b-exam" : "b-todo"),
                        done ? "Done" : isExam(r) ? "Exam" : "To do"));
    box.appendChild(item);
  });
}

function renderAll(){ renderStats(); renderGrades(); renderTests(); renderWeek(); renderList(); }

function sparkle(target){
  const rect = target.getBoundingClientRect();
  ["✨","🌸","💖","✨","🌷"].forEach(s => {
    const sp = el("span", "spark", s);
    sp.style.left = rect.left + 6 + "px"; sp.style.top = rect.top + "px";
    sp.style.setProperty("--x", (Math.random() * 120 - 60) + "px");
    sp.style.setProperty("--y", (-30 - Math.random() * 70) + "px");
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 1000);
  });
}

/* ---------- chips ---------- */
function buildChips(){
  const sBox = document.getElementById("statusChips");
  ["To do", "Done", "All"].forEach(name => {
    const b = el("button", "chip", name); b.dataset.kind = "status"; b.dataset.val = name;
    b.onclick = () => { statusFilter = name; syncChips(); renderList(); };
    sBox.appendChild(b);
  });
  const cBox = document.getElementById("courseChips");
  ["All"].concat(COURSE_ORDER).forEach(name => {
    const b = el("button", "chip", name === "All" ? "All courses" : name); b.dataset.kind = "course"; b.dataset.val = name;
    b.onclick = () => { courseFilter = name; syncChips(); renderGrades(); renderList(); };
    cBox.appendChild(b);
  });
  syncChips();
}
function syncChips(){
  document.querySelectorAll(".chip").forEach(b => {
    const cur = b.dataset.kind === "status" ? statusFilter : courseFilter;
    b.classList.toggle("active", b.dataset.val === cur);
  });
}

/* ---------- start ---------- */
async function load(){
  const note = document.getElementById("note");
  note.textContent = "Tracker snapshot from " + SNAPSHOT_DATE + " · checkmarks you make here are saved on this device only";
  if (SHEET_CSV_URL) {
    try {
      const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now());
      if (!res.ok) throw new Error(res.status);
      const txt = await res.text();
      if (/^\s*</.test(txt)) throw new Error("got a web page instead of CSV data; republish as CSV");
      const live = fromCSV(txt);
      if (!live.length) throw new Error("empty");
      rows = live;
      note.textContent = "Updated from assignments.csv · checkmarks you make here are saved on this device only";
    } catch (err) {
      note.textContent = "Couldn't load assignments.csv (" + ((err && err.message) || err) + "), so the saved snapshot from " + SNAPSHOT_DATE + " is showing.";
    }
  }
  renderAll();
}

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
document.getElementById("search").addEventListener("input", renderList);
document.getElementById("sort").addEventListener("change", renderList);
buildChips();
load();
